<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Glance Digital Wall Calendar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* One palette, dark, always: this page lives on a wall. By Ben's instruction it
   carries no author line and no light/dark switch. */
:root{
  --bg:#000000; --surface:#0b0f12; --ink:#f2f4f5; --ink-2:#b3bdc4; --ink-3:#7b8891;
  --line:#2a3238; --line-2:#3c4750; --accent:#48b0c0;
  --warm:#f5c400; --over:#e2564a; --due:#f0a93b; --soon:#e8c75a;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  background:var(--bg); color:var(--ink); margin:0; overflow:hidden;
  font-family:"Barlow","Helvetica Neue",Arial,sans-serif; font-variant-numeric:tabular-nums;
}
/* The stage is the whole display (less any overscan margin). Screens fill it;
   modules sit on a screen by percentages, so one layout fits any resolution.
   --u is one hundredth of the stage's width, set by the script; every size
   inside a module is in em of (--u x that module's font size). */
.stage{position:fixed; inset:0; overflow:hidden}
.screen{position:absolute; inset:0; opacity:0; visibility:hidden; transition:opacity .8s ease}
.screen.on{opacity:1; visibility:visible}
.mod{position:absolute; overflow:hidden; font-size:calc(var(--u, 10px) * var(--f, 1))}
.mod .quiet{color:var(--ink-3); font-size:1.4em}
.note{position:absolute; left:1em; bottom:.2em; font-size:calc(var(--u, 10px) * .9); color:var(--due); z-index:999}
.debug{position:fixed; left:0; top:0; z-index:9999; background:#103a12; color:#d6ffd9; padding:.5em .8em;
       font:500 max(14px, 1.4vw)/1.4 "Barlow",Arial,sans-serif; white-space:pre; border-bottom-right-radius:.4em}

/* --- date and time ----------------------------------------------------- */
.m-datetime{display:flex; flex-direction:column; justify-content:center}
.m-datetime .date{font-size:2.9em; font-weight:400; color:var(--ink-2); line-height:1.1}
.m-datetime .time{font-size:14.5em; font-weight:500; line-height:.95; letter-spacing:-.02em}
.m-datetime .time small{font-size:.3em; font-weight:400; color:var(--ink-2); margin-left:.25em; letter-spacing:0}

/* --- current weather --------------------------------------------------- */
.m-weather{display:flex; flex-direction:column; justify-content:center; align-items:flex-end; color:var(--warm); text-align:right; padding:1em 1.3em}
.m-weather.framed{border:1px solid var(--line); border-radius:.5em}
.m-weather .big{display:flex; align-items:center; gap:.25em; font-size:5.6em; font-weight:400; line-height:1}
.m-weather .big svg{width:1.05em; height:1.05em}
.m-weather .feels{font-size:1.75em; margin-top:.7em}
.m-weather .wind{font-size:1.5em; margin-top:.9em; padding-top:.8em; border-top:1px solid var(--line); width:100%}
.m-weather .where{font-size:1.1em; color:var(--ink-3); margin-top:.5em}

/* --- forecast (see-through, so it can sit on top of a photo) ----------- */
.m-forecast .days{height:100%; display:grid; grid-auto-flow:column; grid-auto-columns:1fr; padding:1.2em .6em 1em}
.m-forecast .day{display:flex; flex-direction:column; align-items:center; justify-content:space-between; color:var(--warm); text-shadow:0 0 .35em #000, 0 0 .1em #000}
.m-forecast .day .name{font-size:3.2em; font-weight:400; line-height:1}
.m-forecast .day svg{width:6.6em; height:6.6em; filter:drop-shadow(0 0 .3em #000)}
.m-forecast .day .wet{font-size:2em; line-height:1.25; text-align:center}
.m-forecast .day .hilo{font-size:3.1em; font-weight:400; display:flex; gap:.5em; line-height:1; align-items:baseline}
.m-forecast .day .hilo .lo{font-size:.8em; opacity:.9}

/* --- calendar ----------------------------------------------------------- */
.m-calendar .dayhead{display:flex; align-items:baseline; gap:.5em; border-bottom:1px solid var(--line-2); padding-bottom:.15em; margin:.75em 0 .4em}
.m-calendar .dayblock:first-child .dayhead{margin-top:0}
.m-calendar .dayhead .num{font-size:2.5em; font-weight:300; line-height:1}
.m-calendar .dayhead .lab{font-size:1.45em; color:var(--ink-2)}
.m-calendar .ev{display:flex; gap:.7em; align-items:baseline; padding:.22em 0 .22em .6em; border-left:.22em solid var(--ink-3); margin:.3em 0}
.m-calendar .ev .when{flex:none; width:5.2em; font-size:1.05em; color:var(--ink-2); text-transform:uppercase; letter-spacing:.02em}
.m-calendar .ev .what{font-size:1.45em; line-height:1.25; min-width:0; overflow-wrap:anywhere}
.m-calendar .ev.past{opacity:.45}
.m-calendar .roll{will-change:transform}
/* More below than fits: fade the bottom edge so it reads as "continues". */
.m-calendar.more{-webkit-mask-image:linear-gradient(to bottom, #000 0, #000 90%, transparent 100%); mask-image:linear-gradient(to bottom, #000 0, #000 90%, transparent 100%)}
.m-calendar.byhand{overflow-y:auto; scrollbar-width:none; overscroll-behavior:contain}
.m-calendar.byhand::-webkit-scrollbar{display:none}

/* --- Chore Factory (chores due) ----------------------------------------- */
.m-nextup .hd{display:flex; align-items:baseline; gap:.7em; margin-bottom:.35em; border-bottom:2px solid var(--line-2); padding-bottom:.3em}
.m-nextup h2{font-size:1.5em; font-weight:700; letter-spacing:.06em; text-transform:uppercase; margin:0}
.m-nextup .n{font-size:1.05em; color:var(--ink-3); letter-spacing:.05em}
.m-nextup .stale{font-size:1em; color:var(--due)}
.m-nextup .row{display:flex; align-items:baseline; gap:.7em; padding:.28em 0 .28em .6em; border-left:.22em solid var(--ink-3); border-bottom:1px solid var(--line)}
.m-nextup .row:last-child{border-bottom:0}
.m-nextup .what{flex:1; min-width:0}
.m-nextup .task{font-size:1.35em; font-weight:600}
.m-nextup .item{font-size:.95em; color:var(--ink-3)}
.m-nextup .when{font-size:1.25em; font-weight:600; white-space:nowrap; text-align:right}
.m-nextup .when span{display:block; font-size:.7em; font-weight:400; color:var(--ink-3)}
.m-nextup .over{border-left-color:var(--over)}   .m-nextup .over .when{color:var(--over)}
.m-nextup .today{border-left-color:var(--due)}   .m-nextup .today .when{color:var(--due)}
.m-nextup .soon{border-left-color:var(--soon)}   .m-nextup .soon .when{color:var(--soon)}
.m-nextup .none{font-size:1.3em; color:var(--accent); padding:.3em 0}

/* --- sensors (water detectors and doors, from the SmartThings hub) ------- */
.m-sensors .hd{display:flex; align-items:baseline; gap:.7em; margin-bottom:.35em; border-bottom:2px solid var(--line-2); padding-bottom:.3em}
.m-sensors h2{font-size:1.5em; font-weight:700; letter-spacing:.06em; text-transform:uppercase; margin:0}
.m-sensors .n{font-size:1.05em; color:var(--ink-3); letter-spacing:.05em}
.m-sensors .stale{font-size:1em; color:var(--due)}
.m-sensors .row{display:flex; align-items:baseline; gap:.7em; padding:.28em 0 .28em .6em; border-left:.22em solid var(--ink-3); border-bottom:1px solid var(--line)}
.m-sensors .row:last-child{border-bottom:0}
.m-sensors .nm{flex:1; min-width:0; font-size:1.35em; font-weight:600}
.m-sensors .st{font-size:1.25em; font-weight:600; white-space:nowrap; text-align:right; color:var(--ink-2)}
.m-sensors .st span{display:block; font-size:.7em; font-weight:400; color:var(--ink-3)}
.m-sensors .bad{border-left-color:var(--over)}  .m-sensors .bad .st{color:var(--over)}
.m-sensors .warn{border-left-color:var(--due)}  .m-sensors .warn .st{color:var(--due)}
.m-sensors .none{font-size:1.3em; color:var(--accent); padding:.3em 0}

/* --- photos ------------------------------------------------------------- */
.m-photos.round{border-radius:.7em}
.m-photos .pic{position:absolute; inset:0; background-position:center; background-repeat:no-repeat; opacity:0; transition:opacity 1.2s ease}
.m-photos .pic.on{opacity:1}
.m-photos .veil{position:absolute; inset:0; background:#000}
.m-photos .quiet{position:absolute; left:1em; top:1em}

/* --- text and countdown ------------------------------------------------- */
/* --- button: jump to a screen ------------------------------------------- */
.m-button{overflow:visible; padding:.35em}
.m-button .go{
  width:100%; height:100%; border:.12em solid rgba(255,255,255,.35); cursor:pointer; padding:0 .4em;
  font-family:inherit; font-weight:600; font-size:1.9em; line-height:1.1; letter-spacing:.04em; text-transform:uppercase;
  box-shadow:0 .1em .5em rgba(0,0,0,.5); transition:transform .12s ease, box-shadow .12s ease;
}
.m-button .go:focus{outline:none}
.m-button .go:focus-visible, .m-button .go:hover{box-shadow:0 0 0 .22em var(--warm), 0 .1em .7em rgba(0,0,0,.6); transform:scale(1.04)}
.m-button .go:active{transform:scale(.97)}

.m-text{display:flex; flex-direction:column; justify-content:center; font-size:calc(var(--u, 10px) * var(--f, 1) * 2.4); line-height:1.25; white-space:pre-wrap}
.m-countdown{display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; padding:.6em}
.m-countdown.tile{border-radius:.6em; background:var(--tile, #a61e2a); color:#fff}
.m-countdown .label{font-size:2.2em; font-weight:500; line-height:1.15; margin-bottom:.35em}
.m-countdown .well{border-radius:.4em; min-width:55%}
.m-countdown.tile .well{background:rgba(0,0,0,.22); padding:.5em 1.4em .6em}
.m-countdown .num{font-size:7.5em; font-weight:500; line-height:1}
.m-countdown:not(.tile) .num{color:var(--warm)}
.m-countdown .unit{font-size:1.5em; letter-spacing:.12em; text-transform:uppercase; opacity:.8; margin-top:.2em}

/* --- sports ------------------------------------------------------------- */
.m-sports .team{display:grid; grid-template-columns:2.6em 1fr auto; column-gap:.7em; align-items:center; padding:.4em 0; border-bottom:1px solid var(--line)}
.m-sports .team:last-child{border-bottom:0}
.m-sports .logo{width:2.6em; height:2.6em; object-fit:contain; grid-row:1 / span 2}
.m-sports .nm{font-size:1.45em; font-weight:600; line-height:1.15}
.m-sports .nm small{font-size:.7em; font-weight:400; color:var(--ink-3); margin-left:.4em}
.m-sports .last{font-size:1.1em; color:var(--ink-2); grid-column:2}
.m-sports .last b.W{color:#58c27d} .m-sports .last b.L{color:var(--over)}
.m-sports .next{grid-column:3; grid-row:1 / span 2; text-align:right; font-size:1.25em; font-weight:600; line-height:1.2}
.m-sports .next small{display:block; font-size:.75em; font-weight:400; color:var(--ink-3)}
.m-sports .next.live{color:var(--warm)}

/* --- radar or any picture from a web address ---------------------------- */
.m-radar.round{border-radius:.7em}
.m-radar img{width:100%; height:100%; display:block}
.m-radar .quiet{position:absolute; left:1em; top:1em}
</style>
</head>
<body>
<div class="stage" id="stage"><span class="note" id="note"></span></div>

<script>
(function(){
  "use strict";
  var $ = function(id){ return document.getElementById(id); };
  var MIN = 60000, HOUR = 3600000;
  var stage = $("stage");
  var hash = {};
  location.hash.replace(/^#/, "").split("&").forEach(function(p){
    var i = p.indexOf("="); if(i > 0) hash[p.slice(0, i)] = decodeURIComponent(p.slice(i + 1)); else if(p) hash[p] = "";
  });
  var PREVIEW = "preview" in hash;              /* shown inside the Manager's preview */

  var CONFIG = null, device = null, shown = "", turn = 0, rotor = null;
  var DATA = { cal:null, wx:null, chores:null, sports:{}, sensors:null };  /* what the modules draw from */
  var mods = [];                                 /* {mod, el, screen, tick} currently mounted */
  var TAGS = null;                               /* canvas preview only: calendar name -> tag */
  var loop = [];                                 /* the screens this device rotates through, in order */

  function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
  function midnight(d){ d = d ? new Date(d) : new Date(); d.setHours(0,0,0,0); return d; }
  function parseDay(s){ var p = String(s).split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function isoDay(d){ return d.getFullYear() + "-" + ("0" + (d.getMonth() + 1)).slice(-2) + "-" + ("0" + d.getDate()).slice(-2); }
  function fresh(url){ return url + (url.indexOf("?") < 0 ? "?" : "&") + "t=" + Date.now(); }
  function getJSON(url, plain){
    return fetch(plain ? url : fresh(url), plain ? {} : {cache:"no-store"})
      .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); });
  }
  function opt(mod, key, dflt){ var o = mod.opts || {}; return o[key] === undefined ? dflt : o[key]; }
  var notes = {};
  function note(key, text){
    if(text) notes[key] = text; else delete notes[key];
    $("note").textContent = Object.keys(notes).map(function(k){ return notes[k]; }).join("  ·  ");
  }
  var DAYS = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  var MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

  /* ======================================================== modules ==== */
  /* Each kind of module knows how to draw itself into its box from DATA.
     draw() is called when its data arrives, when its box changes size, and
     on its own timer where it has one. */
  var KINDS = {};

  KINDS.datetime = { every:1000, draw:function(el, m){
    var d = new Date(), h24 = !opt(m, "hour12", true), h = h24 ? d.getHours() : (d.getHours() % 12 || 12);
    var t = h + ":" + ("0" + d.getMinutes()).slice(-2) + (opt(m, "seconds", false) ? ":" + ("0" + d.getSeconds()).slice(-2) : "");
    var ampm = (!h24 && opt(m, "ampm", false)) ? "<small>" + (d.getHours() < 12 ? "AM" : "PM") + "</small>" : "";
    el.style.alignItems = {left:"flex-start", center:"center", right:"flex-end"}[opt(m, "align", "left")] || "flex-start";
    el.innerHTML = (opt(m, "showDate", true) ? '<div class="date">' + DAYS[d.getDay()] + ", " + MON[d.getMonth()] + " " + d.getDate() + '</div>' : "") +
                   (opt(m, "showTime", true) ? '<div class="time">' + t + ampm + '</div>' : "");
  }};

  /* Weather pictures are drawn here, not downloaded, so there is no icon set to go missing.
     code: 0 clear, 2 partly cloudy, 3 cloudy, 45 fog, 61 rain, 71 snow, 95 storm. */
  function icon(code, night){
    var sun = '<circle cx="24" cy="24" r="9" fill="currentColor"/><g stroke="currentColor" stroke-width="3" stroke-linecap="round">' +
      '<path d="M24 5v6M24 37v6M5 24h6M37 24h6M10.6 10.6l4.2 4.2M33.2 33.2l4.2 4.2M10.6 37.4l4.2-4.2M33.2 14.8l4.2-4.2"/></g>';
    var moon = '<path d="M30 8a16 16 0 1 0 10 28A18 18 0 0 1 30 8z" fill="currentColor"/>';
    var cloud = function(y){ return '<path transform="translate(0 ' + y + ')" d="M14 34a8 8 0 0 1 .9-15.9A11 11 0 0 1 36 20.5 7 7 0 0 1 35 34z" fill="currentColor"/>'; };
    var smallSun = '<g transform="translate(-6 -8) scale(.62)" opacity=".95">' + (night ? moon : sun) + '</g>';
    var drops = '<g stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M17 38l-2 6M25 38l-2 6M33 38l-2 6"/></g>';
    var flakes = '<g fill="currentColor"><circle cx="16" cy="41" r="2.2"/><circle cx="24" cy="44" r="2.2"/><circle cx="32" cy="41" r="2.2"/></g>';
    var bolt = '<path d="M25 34l-6 8h5l-2 6 7-9h-5z" fill="currentColor"/>';
    var fog = '<g stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M9 36h30M13 42h22"/></g>';
    var body;
    if(code === 0) body = night ? moon : sun;
    else if(code <= 2) body = smallSun + cloud(2);
    else if(code === 3) body = cloud(0);
    else if(code <= 48) body = cloud(-6) + fog;
    else if(code <= 67 || (code >= 80 && code <= 82)) body = cloud(-6) + drops;
    else if(code <= 77 || code === 85 || code === 86) body = cloud(-6) + flakes;
    else body = cloud(-6) + bolt;
    return '<svg viewBox="0 0 48 48" aria-hidden="true">' + body + '</svg>';
  }
  var COMPASS = ["N","NE","E","SE","S","SW","W","NW"];
  function num(v){ return v == null || isNaN(v) ? "–" : Math.round(v); }

  KINDS.weather = { draw:function(el, m){
    el.classList.toggle("framed", opt(m, "frame", true));
    var w = DATA.wx;
    if(!w){ el.innerHTML = '<div class="quiet">' + (DATA.wxWhy || "Weather loading") + '</div>'; return; }
    el.innerHTML = '<div class="big">' + num(w.now.temp) + '°' + icon(w.now.code, w.now.night) + '</div>' +
      (opt(m, "feels", true) ? '<div class="feels">Feels like ' + num(w.now.feels) + '</div>' : "") +
      (opt(m, "wind", true) ? '<div class="wind">' + num(w.now.wind) + ' mph ' + (w.now.dir || "") + ' wind</div>' : "") +
      (opt(m, "place", true) && w.place ? '<div class="where">' + esc(w.place) + '</div>' : "");
  }};

  /* The colder, the bluer: the usual warm color down to 50 degrees, fading to
     an icy white at freezing and a strong blue by zero. */
  var COLD = [[50, [245,196,0]], [32, [214,232,255]], [0, [74,168,255]]];
  function coldColor(t){
    if(t == null || isNaN(t) || t >= COLD[0][0]) return "";
    for(var i = 1; i < COLD.length; i++){
      if(t >= COLD[i][0] || i === COLD.length - 1){
        var a = COLD[i - 1], b = COLD[i], k = Math.max(0, Math.min(1, (a[0] - t) / (a[0] - b[0])));
        return ' style="color:rgb(' + [0,1,2].map(function(c){ return Math.round(a[1][c] + (b[1][c] - a[1][c]) * k); }).join(",") + ')"';
      }
    }
    return "";
  }
  KINDS.forecast = { draw:function(el, m){
    var w = DATA.wx; if(!w){ el.innerHTML = ""; return; }
    var tint = opt(m, "coldBlue", true) ? coldColor : function(){ return ""; };
    var n = Math.max(1, Math.min(6, +opt(m, "days", 4) || 4)), out = "";
    for(var i = 0; i < n && i < w.days.length; i++){
      var d = w.days[i], day = parseDay(d.date);
      out += '<div class="day"><div class="name">' + (d.date === isoDay(new Date()) ? "Today" : DAYS[day.getDay()].slice(0, 3)) + '</div>' +
        icon(d.code, false) +
        (opt(m, "precip", true) ? '<div class="wet">' + (d.pop == null ? "" : Math.round(d.pop) + "%") + '<br>' +
          (d.amt >= 0.005 ? d.amt.toFixed(2) + '″' : "0″") + '</div>' : "") +
        '<div class="hilo"><span' + tint(d.hi) + '>' + num(d.hi) + '</span><span class="lo"' + tint(d.lo) + '>' + num(d.lo) + '</span></div></div>';
    }
    el.innerHTML = '<div class="days">' + out + '</div>';
  }};

  function clock12(hm){ var p = hm.split(":"), h = +p[0]; return (h % 12 || 12) + ":" + p[1] + (h < 12 ? " AM" : " PM"); }
  /* When there is more calendar than fits the box, the module does one of
     three things, chosen in its settings:
       auto    scrolls by itself: waits, glides to the end, waits, starts over
       manual  stays put until scrolled with a mouse wheel, a finger or the
               remote's up and down keys; goes back to the top when left alone
       fit     shows only the whole days that fit, and no more */
  KINDS.calendar = { every:5 * MIN,
    unmount:function(el, m, rec){ clearTimeout(rec.roll); clearTimeout(rec.idle); },
    draw:function(el, m, rec, again){
      rec = rec || {};
      var cal = DATA.cal;
      if(!cal){ clearTimeout(rec.roll); rec.sig = ""; el.className = "mod m-calendar"; el.innerHTML = '<div class="quiet">' + (DATA.calWhy || "Calendar loading") + '</div>'; return; }
      var mode = opt(m, "overflow", "auto");
      var now = new Date(), today = isoDay(now), tomorrow = isoDay(new Date(midnight().getTime() + 26 * HOUR));
      /* While it is gliding, leave it alone unless something it shows has
         changed; each pass rebuilds the list anyway when it starts over. */
      var sig = [cal.generated, today, mode, JSON.stringify(m.opts || {}), el.clientWidth, el.clientHeight, getComputedStyle(el).fontSize, getComputedStyle(el).fontFamily].join("|");
      if(!again && mode === "auto" && rec.rolling && sig === rec.sig) return;
      rec.sig = sig;
      clearTimeout(rec.roll); rec.rolling = false;

      var last = isoDay(new Date(midnight().getTime() + (+opt(m, "days", 14) || 14) * 24 * HOUR + 2 * HOUR));
      var nowHM = ("0" + now.getHours()).slice(-2) + ":" + ("0" + now.getMinutes()).slice(-2);
      /* A module may show only some calendars. The layout names them by tag (a
         random label that says nothing about the calendar). Data from before
         tags existed has none, and then everything is shown. */
      var pick = opt(m, "calendars", null);
      var tagOf = function(c){ return c.id || (TAGS && TAGS[c.name]) || ""; };
      var tagged = cal.calendars.some(tagOf);
      var allow = cal.calendars.map(function(c){ return !Array.isArray(pick) || !tagged || pick.indexOf(tagOf(c)) >= 0; });
      var byDay = {}, order = [];
      cal.events.forEach(function(e){
        if(e.d < today || e.d > last || allow[e.c] === false) return;
        if(!byDay[e.d]){ byDay[e.d] = []; order.push(e.d); }
        byDay[e.d].push(e);
      });

      var keep = mode === "manual" ? el.scrollTop : 0;      /* a redraw must not yank a hand-scrolled list back */
      el.className = "mod m-calendar" + (mode === "manual" ? " byhand" : "");
      el.innerHTML = "";
      if(!order.length){
        el.innerHTML = '<div class="quiet">' + (Array.isArray(pick) && tagged && !pick.length ? "No calendars chosen for this module." : "Nothing on the calendar.") + '</div>';
        return;
      }
      var inner = document.createElement("div");
      inner.className = "roll";
      el.appendChild(inner);
      for(var i = 0; i < order.length; i++){
        var d = order[i], date = parseDay(d);

                  (e.t ? clock12(e.t) : "All day") + '</span><span class="what">' + esc(e.s) + '</span></div>';

    for(var n = 0; n < want.length; n++) CONFIG.screens.forEach(function(sc){

        if(to && want.indexOf(to) < 0) want.push(to);

  /* The loop: a device's screens in turn. Started afresh whenever a button

  function startLoop(){
    clearInterval(rotor);
    var secs = device ? +device.rotateSeconds || 0 : 0;
    if(PREVIEW || loop.length < 2 || secs < 3) return;
    rotor = setInterval(function(){
      var at = loop.indexOf(shown);
      turn = ((at >= 0 ? at : turn) + 1) % loop.length;
      show(loop[turn]);
    }, secs * 1000);
  }
  function jump(id){
    if(!id || id === shown || !stage.querySelector('.screen[data-id="' + id + '"]')) return;
    if(loop.indexOf(id) >= 0) turn = loop.indexOf(id);
    show(id);
    startLoop();
  }
  function show(id){
    shown = id;
    Array.prototype.forEach.call(stage.querySelectorAll(".screen"), function(s){ s.classList.toggle("on", s.dataset.id === id); });
    measure();
    /* With a remote in use, keep a button highlighted so OK always has a target. */
    if(remoteUsed){ var b = stage.querySelector(".screen.on .go"); if(b) b.focus(); }
  }
  /* A TV remote reaches the page as arrow keys and Enter. Arrows move the
     highlight between the buttons on the screen; OK presses the highlighted
     one. With a single button on the screen, OK presses it straight away. */
  var remoteUsed = false;
  window.addEventListener("keydown", function(e){
    if(PREVIEW) return;
    /* Up and down belong to a hand-scrolled calendar when there is one with
       more to show; buttons are then reached with left and right. */
    if(e.key === "ArrowDown" || e.key === "ArrowUp"){
      var lists = Array.prototype.filter.call(stage.querySelectorAll(".screen.on .m-calendar.byhand"), function(c){ return c.scrollHeight > c.clientHeight + 2; });
      if(lists.length){
        e.preventDefault();
        lists.forEach(function(c){ c.scrollBy({top:(e.key === "ArrowDown" ? 1 : -1) * c.clientHeight * 0.5, behavior:"smooth"}); });
        return;
      }
    }
    var btns = Array.prototype.slice.call(stage.querySelectorAll(".screen.on .go"));
    if(!btns.length) return;
    var at = btns.indexOf(document.activeElement);
    var ok = e.key === "Enter" || e.key === " " || e.keyCode === 13 || e.keyCode === 23 || e.keyCode === 66;
    var step = (e.key === "ArrowRight" || e.key === "ArrowDown") ? 1 : (e.key === "ArrowLeft" || e.key === "ArrowUp") ? -1 : 0;
    if(!ok && !step) return;
    remoteUsed = true;
    if(step){
      e.preventDefault();
      btns[at < 0 ? 0 : (at + step + btns.length) % btns.length].focus();
    } else if(at < 0){
      e.preventDefault();
      if(btns.length === 1) btns[0].click(); else btns[0].focus();
    }                                             /* a highlighted button presses itself on OK */
  });
  function pickDevice(id){
    var list = CONFIG.devices || [];
    device = null;
    for(var i = 0; i < list.length; i++) if(list[i].id === id) device = list[i];
    if(!device) device = list[0] || null;
  }

  /* ======================================================== weather ==== */
  function textCode(t){
    t = String(t || "").toLowerCase();
    if(/thunder|t-storm|tstorm/.test(t)) return 95;
    if(/snow|flurr|blizzard|sleet|ice|wintry|freezing/.test(t)) return 71;
    if(/rain|shower|drizzle/.test(t)) return 61;
    if(/fog|haze|mist|smoke/.test(t)) return 45;
    if(/partly|mostly sunny|mostly clear|few clouds/.test(t)) return 2;
    if(/cloud|overcast/.test(t)) return 3;
    return 0;
  }
  function fromOpenMeteo(lat, lon){
    var u = "https://api.open-meteo.com/v1/forecast?latitude=" + lat + "&longitude=" + lon +
      "&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m,wind_direction_10m,is_day" +
      "&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,precipitation_sum" +
      "&temperature_unit=fahrenheit&wind_speed_unit=mph&precipitation_unit=inch&timezone=auto&forecast_days=7";
    return getJSON(u).then(function(w){
      var c = w.current, d = w.daily;
      return { now:{temp:c.temperature_2m, feels:c.apparent_temperature, wind:c.wind_speed_10m,
                    dir:COMPASS[Math.round(c.wind_direction_10m / 45) % 8], code:c.weather_code, night:!c.is_day},
               days:d.time.map(function(t, i){ return {date:t, code:d.weather_code[i], pop:d.precipitation_probability_max[i],
                    amt:d.precipitation_sum[i] || 0, hi:d.temperature_2m_max[i], lo:d.temperature_2m_min[i]}; }) };
    });
  }
  /* The US National Weather Service: free, no account, United States only. */
  function fromNWS(lat, lon){
    var f = function(c){ return c == null ? null : c * 9 / 5 + 32; };
    return getJSON("https://api.weather.gov/points/" + (+lat).toFixed(4) + "," + (+lon).toFixed(4), true).then(function(p){
      var pr = p.properties;
      return Promise.all([
        getJSON(pr.forecast, true),
        getJSON(pr.forecastGridData, true).catch(function(){ return null; }),
        getJSON(pr.observationStations, true).then(function(s){ return getJSON(s.features[0].id + "/observations/latest", true); }).catch(function(){ return null; })
      ]);
    }).then(function(r){
      var periods = r[0].properties.periods, grid = r[1] && r[1].properties, obs = r[2] && r[2].properties;
      var by = {}, order = [];
      periods.forEach(function(p){
        var d = p.startTime.slice(0, 10);
        if(!by[d]){ by[d] = {date:d, code:null, pop:null, amt:0, hi:null, lo:null}; order.push(d); }
        var pop = p.probabilityOfPrecipitation && p.probabilityOfPrecipitation.value;
        if(pop != null) by[d].pop = Math.max(by[d].pop || 0, pop);
        if(p.isDaytime){ by[d].hi = p.temperature; by[d].code = textCode(p.shortForecast); }
        else { by[d].lo = p.temperature; if(by[d].code === null) by[d].code = textCode(p.shortForecast); }
      });
      if(grid && grid.quantitativePrecipitation) grid.quantitativePrecipitation.values.forEach(function(v){
        var d = isoDay(new Date(v.validTime.split("/")[0]));
        if(by[d] && v.value) by[d].amt += v.value / 25.4;
      });
      var first = periods[0], t = obs && obs.temperature && obs.temperature.value;
      var feels = obs && ((obs.windChill && obs.windChill.value) != null ? obs.windChill.value : (obs.heatIndex && obs.heatIndex.value));
      var kmh = obs && obs.windSpeed && obs.windSpeed.value, deg = obs && obs.windDirection && obs.windDirection.value;
      return { now:{ temp: t != null ? f(t) : first.temperature, feels: feels != null ? f(feels) : (t != null ? f(t) : first.temperature),
                     wind: kmh != null ? kmh * 0.621371 : parseInt(first.windSpeed, 10) || 0,
                     dir: deg != null ? COMPASS[Math.round(deg / 45) % 8] : (first.windDirection || ""),
                     code: textCode(obs && obs.textDescription ? obs.textDescription : first.shortForecast), night: !first.isDaytime },
               days: order.map(function(d){ return by[d]; }) };
    });
  }
  function loadWeather(){
    var c = DATA.cal;
    if(!c || c.lat == null){ return; }
    var src = (CONFIG.weather && CONFIG.weather.source) || "open-meteo";
    (src === "nws" ? fromNWS(c.lat, c.lon) : fromOpenMeteo(c.lat, c.lon)).then(function(w){
      w.place = c.place; w.source = src; DATA.wx = w; drawKind("weather", "forecast");
    }).catch(function(){
      if(!DATA.wx){ DATA.wxWhy = "Weather unavailable"; drawKind("weather"); }   /* else keep the last reading up */
    });
  }

  /* ======================================================= calendar ==== */
  /* The data file in the public repository is locked. The key is the k= part
     of the address this page was opened with; it is never sent anywhere. */
  function b64(s){
    s = s.replace(/-/g, "+").replace(/_/g, "/"); while(s.length % 4) s += "=";
    var bin = atob(s), out = new Uint8Array(bin.length);
    for(var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }
  function unlock(text, withKey){               /* withKey: key bytes other than the display's own */
    var raw = b64(text.trim());
    return crypto.subtle.importKey("raw", withKey instanceof Uint8Array ? withKey : b64(hash.k), "AES-GCM", false, ["decrypt"])
      .then(function(key){ return crypto.subtle.decrypt({name:"AES-GCM", iv:raw.slice(0, 12)}, key, raw.slice(12)); })
      .then(function(buf){ return JSON.parse(new TextDecoder().decode(buf)); });
  }
  function dataUrl(){
    if(CONFIG.dataUrl) return CONFIG.dataUrl;
    var m = /^([^.]+)\.github\.io$/.exec(location.hostname), repo = location.pathname.split("/")[1];
    if(m && repo) return "https://raw.githubusercontent.com/" + m[1] + "/" + repo + "/data/calendar.enc";
    return "calendar.enc";                       /* the Manager's preview, or testing */
  }
  function useCalendar(data){
    var moved = !DATA.cal || DATA.cal.lat !== data.lat || DATA.cal.lon !== data.lon;
    DATA.cal = data;
    drawKind("calendar", "photos");
    if(moved || !DATA.wx) loadWeather();
    var age = (Date.now() - new Date(data.generated).getTime()) / HOUR;
    var failed = (data.failed || []).map(function(i){ return (data.calendars[i] || {}).name; }).filter(Boolean);
    note("calendar", age > 36 ? "calendar last updated " + MON[new Date(data.generated).getMonth()] + " " + new Date(data.generated).getDate()
       : failed.length ? "could not refresh: " + failed.join(", ") : "");
    note("photos", data.photosFailed ? "could not refresh the photo album" : "");
  }
  function loadCalendar(){
    if(!hash.k || !window.crypto || !crypto.subtle){
      DATA.calWhy = hash.k ? "This browser cannot unlock the calendar." : "The calendar key is missing from this page’s address.";
      DATA.wxWhy = "Weather needs the calendar key too";   /* the location travels in the locked file */
      drawKind("calendar", "weather");
      return;
    }
    fetch(fresh(dataUrl()), {cache:"no-store"})
      .then(function(r){ if(!r.ok) throw new Error(r.status); return r.text(); })
      .then(function(text){
        return unlock(text).then(function(data){
          try{ localStorage.setItem("glance-calendar", text); }catch(e){}
          useCalendar(data);
        });
      })
      .catch(function(){
        if(DATA.cal) return;                     /* keep what is on screen */
        var kept = null; try{ kept = localStorage.getItem("glance-calendar"); }catch(e){}
        var none = function(){ DATA.calWhy = "Calendar unavailable"; drawKind("calendar"); };
        if(kept) unlock(kept).then(useCalendar).catch(none); else none();
      });
  }

  /* ======================================================== sensors ==== */
  /* The listener keeps one locked file, sensors.enc, in a small repository of
     its own beside this one (same owner, this repository's name plus
     "-sensors"). Its key is made from the display's key, so the machine that
     writes the file never holds the key that opens the calendar. */
  function sensorsWanted(){
    return CONFIG.screens.some(function(sc){ return (sc.modules || []).some(function(m){ return m.type === "sensors" && !m.hidden; }); });
  }
  function sensorsRepo(){
    var named = CONFIG.sensors && CONFIG.sensors.repo;
    if(named && /^[A-Za-z0-9_.\-]+\/[A-Za-z0-9_.\-]+$/.test(named)) return named;
    var m = /^([^.]+)\.github\.io$/.exec(location.hostname), repo = location.pathname.split("/")[1];
    return m && repo ? m[1] + "/" + repo + "-sensors" : "";
  }
  var sensorKeyReady = null;
  function sensorKey(){
    if(!sensorKeyReady){
      var mine = b64(hash.k), tail = new TextEncoder().encode("|glance-sensors-v1"), all = new Uint8Array(mine.length + tail.length);
      all.set(mine); all.set(tail, mine.length);
      sensorKeyReady = crypto.subtle.digest("SHA-256", all).then(function(buf){ return new Uint8Array(buf); });
    }
    return sensorKeyReady;
  }
  var sensorsAsked = 0;
  function loadSensors(){
    var repo = sensorsRepo();
    if(!repo || !sensorsWanted() || !hash.k || !window.crypto || !crypto.subtle) return;
    if(Date.now() - sensorsAsked < 50000) return;   /* a layout being edited calls here often */
    sensorsAsked = Date.now();
    var body = function(r){ if(!r.ok) throw new Error(r.status); return r.text(); };
    /* GitHub's own address answers with the newest file but allows only so
       many asks an hour; the plain file address has no limit but can lag by
       about five minutes. Ask the first, fall back to the second. */
    fetch("https://api.github.com/repos/" + repo + "/contents/sensors.enc", {cache:"no-store", headers:{Accept:"application/vnd.github.raw+json"}}).then(body)
      .catch(function(){ return fetch(fresh("https://raw.githubusercontent.com/" + repo + "/main/sensors.enc"), {cache:"no-store"}).then(body); })
      .then(function(text){ return sensorKey().then(function(key){ return unlock(text, key); }); })
      .then(function(d){ DATA.sensors = d; DATA.sensorsWhy = ""; drawKind("sensors"); })
      .catch(function(){ if(!DATA.sensors){ DATA.sensorsWhy = "Sensors: no report yet"; drawKind("sensors"); } });
  }

  /* ========================================================= sports ==== */
  function sportsKeys(){
    var seen = {}, out = [];
    CONFIG.screens.forEach(function(sc){ (sc.modules || []).forEach(function(m){
      if(m.type === "sports" && !m.hidden) ((m.opts || {}).teams || []).forEach(function(k){
        if(!seen[k] && /^[a-z0-9.\-]+\/[a-z0-9.\-]+\/[a-z0-9.\-]+$/i.test(k)){ seen[k] = true; out.push(k); } });
    }); });
    return out;
  }
  function digestTeam(j){
    var t = j.team || {}, id = String(t.id);
    var out = {name:t.name || t.shortDisplayName || t.displayName || t.abbreviation || "", record:t.recordSummary || "",
               logo:t.logo || (t.logos && t.logos[0] && t.logos[0].href) || "", last:null, next:null, live:null};
    var score = function(x){ return x.score == null ? "" : (typeof x.score === "object" ? x.score.displayValue : String(x.score)); };
    (j.events || []).forEach(function(e){
      var c = e.competitions && e.competitions[0]; if(!c || !c.competitors) return;
      var me = null, opp = null;
      c.competitors.forEach(function(x){ if(String(x.team.id) === id) me = x; else opp = x; });
      if(!me || !opp) return;
      var st = (c.status && c.status.type) || {}, at = new Date(e.date).getTime();
      var g = {at:at, opp:opp.team.abbreviation || opp.team.shortDisplayName || "", home:me.homeAway === "home", mine:score(me), theirs:score(opp),
               res:me.winner === true ? "W" : opp.winner === true ? "L" : "T", detail:st.shortDetail || ""};
      if(st.state === "in") out.live = g;
      else if(st.completed){ if(!out.last || at > out.last.at) out.last = g; }
      else if(st.state === "pre" && at > Date.now() - 4 * HOUR){ if(!out.next || at < out.next.at) out.next = g; }
    });
    return out;
  }
  function loadSports(){
    sportsKeys().forEach(function(k){
      var p = k.split("/");
      getJSON("https://site.api.espn.com/apis/site/v2/sports/" + p[0] + "/" + p[1] + "/teams/" + p[2] + "/schedule", true)
        .then(function(j){ DATA.sports[k] = digestTeam(j); drawKind("sports"); }).catch(function(){});
    });
  }
  function anyLive(){ return Object.keys(DATA.sports).some(function(k){ return DATA.sports[k].live; }); }

  function loadChores(){
    if(!CONFIG.nextUpFeed) return;
    getJSON(CONFIG.nextUpFeed).then(function(j){
      if(j && j.tasks && j.tasks.length){ DATA.chores = j; drawKind("nextup"); }
    }).catch(function(){});
  }

  /* The page never needs to know the display's resolution: every size is a
     share of whatever area the browser reports. This panel shows what a given
     display does report (add &debug to the address). */
  function showDebug(){
    var el = $("debug") || document.body.appendChild(document.createElement("div"));
    el.id = "debug"; el.className = "debug";
    var w = window.innerWidth, h = window.innerHeight, r = window.devicePixelRatio || 1;
    el.textContent = [
      "page area   " + w + " x " + h + "  (shape " + (w / h).toFixed(3) + ", 16:9 is 1.778)",
      "pixel ratio " + r + "  ->  about " + Math.round(w * r) + " x " + Math.round(h * r) + " real pixels",
      "screen      " + screen.width + " x " + screen.height,
      "device      " + (device ? device.id + " (" + device.name + "), margin " + (device.margin || 0) + "%" : "none"),
      navigator.userAgent.replace(/^Mozilla\/5\.0 /, "").slice(0, 90)
    ].join(String.fromCharCode(10));
  }

  /* ========================================================== start ==== */
  function useConfig(c){
    var wasSource = CONFIG && (CONFIG.weather || {}).source;
    CONFIG = c || {};
    CONFIG.screens = CONFIG.screens || []; CONFIG.devices = CONFIG.devices || [];
    pickDevice(hash.device);
    build();
    note("layout", CONFIG.screens.length || PREVIEW ? "" : hash.k ? "No layout has been published yet."
                                                               : "This display needs its full address: the key is missing from it.");
    if(wasSource !== undefined && ((CONFIG.weather || {}).source) !== wasSource){ DATA.wx = null; drawKind("weather", "forecast"); loadWeather(); }
    loadSports();
    if(!DATA.sensors) loadSensors();
  }
  var lastDay = isoDay(new Date());
  function start(c){
    useConfig(c);
    loadCalendar(); setInterval(loadCalendar, 10 * MIN);
    setInterval(loadWeather, 15 * MIN);
    loadChores(); setInterval(loadChores, HOUR);
    setInterval(loadSports, 10 * MIN);
    setInterval(loadSensors, PREVIEW ? 10 * MIN : 2 * MIN);
    setInterval(function(){
      if(anyLive()) loadSports();                 /* a game is on: keep the score moving */
      var t = isoDay(new Date()); if(t !== lastDay){ lastDay = t; drawAll(); }   /* midnight rolled over */
    }, MIN);
    window.addEventListener("resize", measure);
    if(PREVIEW && window.parent !== window){
      /* Inside the Manager: take the layout being edited from the editor. */
      window.addEventListener("message", function(ev){
        var d = ev.data || {};
        if(ev.origin !== location.origin || d.type !== "glance-layout") return;
        TAGS = d.tags || null;
        hash.device = d.device; shown = d.screen || shown;
        useConfig(d.config); loadChores();
      });
      window.parent.postMessage({type:"glance-ready"}, location.origin);
    }
  }

  /* The layout (screens, modules, their text and addresses) is published
     locked, like the calendar: layout.enc, opened with the key in this page's
     address. Nothing about what the display shows is readable in the public
     repository. config.json is the older, readable form, still honored so a
     display keeps working until the first locked layout is published. */
  var layoutText = null;
  function fetchLayout(){
    if(!hash.k || !window.crypto || !crypto.subtle) return Promise.reject(new Error("no key"));
    return fetch(fresh("layout.enc"), {cache:"no-store"})
      .then(function(r){ if(!r.ok) throw new Error(r.status); return r.text(); })
      .then(function(text){ return unlock(text).then(function(c){ return {text:text, config:c}; }); });
  }
  if(PREVIEW) start({});
  else fetchLayout().then(function(l){ layoutText = l.text; start(l.config); },
                          function(){ getJSON("config.json").then(start, function(){ start({}); }); });

  /* A wall display never reloads on its own, so check every ten minutes
     whether this page or its layout has changed. A changed layout is applied
     in place; a changed page reloads. If the check fails (no internet) do
     nothing: a reload at that moment would replace the display with an error
     page. */
  var mine = null;
  function checkForChanges(){
    if(PREVIEW) return;
    fetch(fresh(location.pathname), {cache:"no-store"})
      .then(function(r){ if(!r.ok) throw 0; return r.text(); })
      .then(function(t){ if(mine === null) mine = t; else if(t !== mine) location.reload(); })
      .catch(function(){});
    fetch(fresh("layout.enc"), {cache:"no-store"})
      .then(function(r){ if(!r.ok) throw 0; return r.text(); })
      .then(function(t){
        if(t === layoutText) return;
        return unlock(t).then(function(c){ layoutText = t; useConfig(c); loadChores(); });
      }).catch(function(){});
  }
  checkForChanges(); setInterval(checkForChanges, 10 * MIN);
})();
</script>
</body>
</html>
