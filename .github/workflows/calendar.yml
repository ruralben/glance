# Refreshes the calendar data for Glance Digital Wall Calendar.
# Fetches the family calendars (and the photo album's picture list), trims
# them to what the display shows, encrypts the result and publishes it as the
# single file on the "data" branch. Nothing readable is published: this
# repository is public, and so is this job's log.
name: Calendar

on:
  schedule:
    - cron: "7,37 * * * *"     # every half hour; GitHub often runs these late
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: calendar
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements.txt

      - run: pip install --quiet -r tools/requirements.txt

      - name: Fetch the previous data file, if there is one
        run: |
          if git fetch --quiet origin data 2>/dev/null; then
            git show FETCH_HEAD:calendar.enc > ../old.enc 2>/dev/null || rm -f ../old.enc
          fi

      - name: Build the data file
        env:
          BOARD_SETTINGS: ${{ secrets.BOARD_SETTINGS }}
          BOARD_KEY: ${{ secrets.BOARD_KEY }}
        run: python tools/build_calendar.py --out ../new.enc --old ../old.enc

      # The data branch is always exactly one commit holding one file. It is
      # replaced, not added to, so the repository does not grow by a copy of
      # the data every half hour.
      - name: Publish it
        run: |
          if [ ! -f ../new.enc ]; then
            echo "nothing to publish"
            exit 0
          fi
          git worktree add --quiet --detach ../data
          cd ../data
          git switch --quiet --orphan fresh
          cp ../new.enc calendar.enc
          git add calendar.enc
          git -c user.name="glance" -c user.email="glance@users.noreply.github.com" \
              commit --quiet -m "Calendar data"
          git push --quiet --force origin fresh:data
